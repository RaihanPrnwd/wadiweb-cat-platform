<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wadiFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="wadiAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Rounded Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#wadiFavGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Abstract Code Bracket & Upward Dynamic 'W' Icon -->
  <g filter="url(#subtleShadow)">
    <!-- Main W Monogram with Code Bracket Angles -->
    <path d="M15 23 L24.5 45.5 L32 28.5 L39.5 45.5 L49 23" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Code Bracket Slash / Launch Accent Point -->
    <circle cx="32" cy="18" r="2.75" fill="url(#wadiAccentGrad)" />
  </g>
</svg>
